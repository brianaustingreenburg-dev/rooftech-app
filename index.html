// ── Measurement types ─────────────────────────────────────────
const MEAS_TYPES = [
  {
    id:'losa', label:'Losa de concreto', icon:'🏗️', unit:'m²', fields:[
      {id:'largo',label:'Largo (m)',def:6},{id:'ancho',label:'Ancho (m)',def:4},{id:'espesor',label:'Espesor (m)',def:0.12}
    ],
    calc:f=>{
      const vol = f.largo*f.ancho*f.espesor;
      const cement = Math.ceil(vol*7); const arena = +(vol*0.6).toFixed(2);
      const grava = +(vol*0.85).toFixed(2); const varilla = Math.ceil(f.largo*f.ancho*1.5);
      return [
        {k:'Área',v:`${(f.largo*f.ancho).toFixed(2)} m²`},
        {k:'Volumen concreto',v:`${vol.toFixed(3)} m³`},
        {k:'Sacos cemento (50kg)',v:`${cement} sacos`},
        {k:'Arena',v:`${arena} m³`},
        {k:'Grava',v:`${grava} m³`},
        {k:'Varilla 3/8"',v:`${varilla} ml`},
      ];
    }
  },
  {
    id:'tabique', label:'Muro de tabique', icon:'🧱', unit:'m²', fields:[
      {id:'alto',label:'Alto (m)',def:2.5},{id:'largo',label:'Largo (m)',def:5},{id:'vanos',label:'Vanos/puertas',def:1}
    ],
    calc:f=>{
      const bruta = f.alto*f.largo; const neta = bruta-(f.vanos*2.1);
      const tabiques = Math.ceil(neta*60*1.05);
      const cement = Math.ceil(neta*0.3); const arena = +(neta*0.05).toFixed(2);
      return [
        {k:'Área bruta',v:`${bruta.toFixed(2)} m²`},
        {k:'Área neta',v:`${neta.toFixed(2)} m²`},
        {k:'Tabiques (incluye 5% merma)',v:`${tabiques} pzas`},
        {k:'Cemento',v:`${cement} sacos`},
        {k:'Arena',v:`${arena} m³`},
      ];
    }
  },
  {
    id:'cimentacion', label:'Cimentación (zapata corrida)', icon:'⛏️', unit:'m³', fields:[
      {id:'largo',label:'Largo total ml',def:30},{id:'ancho',label:'Ancho (m)',def:0.6},{id:'prof',label:'Profundidad (m)',def:0.8}
    ],
    calc:f=>{
      const vol = f.largo*f.ancho*f.prof; const excavacion = f.largo*f.ancho*(f.prof+0.2);
      const cement = Math.ceil(vol*9); const varilla = Math.ceil(f.largo*8);
      return [
        {k:'Volumen concreto',v:`${vol.toFixed(2)} m³`},
        {k:'Excavación',v:`${excavacion.toFixed(2)} m³`},
        {k:'Sacos cemento',v:`${cement} sacos`},
        {k:'Varilla 1/2"',v:`${varilla} ml`},
        {k:'Malla electrosoldada',v:`${(f.largo*0.7).toFixed(1)} m²`},
      ];
    }
  },
  {
    id:'aplanado', label:'Aplanado / repello', icon:'🪣', unit:'m²', fields:[
      {id:'alto',label:'Alto (m)',def:2.5},{id:'perimetro',label:'Perímetro (m)',def:20},{id:'espesor',label:'Espesor (cm)',def:1.5}
    ],
    calc:f=>{
      const area = f.alto*f.perimetro; const vol = area*(f.espesor/100);
      const cement = Math.ceil(vol*8); const cal = Math.ceil(vol*4);
      return [
        {k:'Área',v:`${area.toFixed(2)} m²`},
        {k:'Volumen mezcla',v:`${vol.toFixed(3)} m³`},
        {k:'Sacos cemento',v:`${cement} sacos`},
        {k:'Cal hidratada',v:`${cal} sacos`},
        {k:'Arena',v:`${(vol*0.8).toFixed(3)} m³`},
      ];
    }
  },
  {
    id:'pintura', label:'Pintura interior', icon:'🎨', unit:'m²', fields:[
      {id:'alto',label:'Alto (m)',def:2.5},{id:'perimetro',label:'Perímetro (m)',def:24},{id:'manos',label:'Manos',def:2}
    ],
    calc:f=>{
      const area = f.alto*f.perimetro; const litros = Math.ceil((area/10)*f.manos);
      const cubetas = Math.ceil(litros/19); const sellador = Math.ceil(area/20);
      return [
        {k:'Área a pintar',v:`${area.toFixed(2)} m²`},
        {k:'Litros de pintura',v:`${litros} L`},
        {k:'Cubetas (19L)',v:`${cubetas} cubetas`},
        {k:'Sellador',v:`${sellador} cubetas`},
        {k:'Días estimados (1 pintor)',v:`${Math.ceil(area/30)} días`},
      ];
    }
  },
  {
    id:'azulejo', label:'Azulejo / piso', icon:'🟦', unit:'m²', fields:[
      {id:'largo',label:'Largo (m)',def:4},{id:'ancho',label:'Ancho (m)',def:3},{id:'tamano',label:'Tamaño pieza (cm)',def:60}
    ],
    calc:f=>{
      const area = f.largo*f.ancho; const piezaM2 = (f.tamano/100)**2;
      const piezas = Math.ceil((area/piezaM2)*1.10);
      const adhesivo = Math.ceil(area*0.4); const lechada = Math.ceil(area*0.1);
      return [
        {k:'Área',v:`${area.toFixed(2)} m²`},
        {k:'Piezas (10% merma)',v:`${piezas} pzas`},
        {k:'Adhesivo (bolsas 25kg)',v:`${adhesivo} bolsas`},
        {k:'Lechada / junteado',v:`${lechada} bolsas`},
        {k:'Mano de obra est.',v:`${Math.ceil(area/6)} días`},
      ];
    }
  },
  {
    id:'impermeabilizante', label:'Impermeabilización', icon:'💧', unit:'m²', fields:[
      {id:'largo',label:'Largo (m)',def:8},{id:'ancho',label:'Ancho (m)',def:6},{id:'manos',label:'Manos',def:3}
    ],
    calc:f=>{
      const area = f.largo*f.ancho; const litros = Math.ceil(area*0.35*f.manos);
      const cubetas = Math.ceil(litros/19);
      return [
        {k:'Área',v:`${area.toFixed(2)} m²`},
        {k:'Litros impermeabilizante',v:`${litros} L`},
        {k:'Cubetas (19L)',v:`${cubetas} cubetas`},
        {k:'Primario',v:`${Math.ceil(area/25)} galones`},
        {k:'Días estimados',v:`${Math.ceil(area/40)} días`},
      ];
    }
  },
  {
    id:'concreto', label:'Colado general', icon:'🪨', unit:'m³', fields:[
      {id:'largo',label:'Largo (m)',def:4},{id:'ancho',label:'Ancho (m)',def:3},{id:'alto',label:'Alto / espesor (m)',def:0.15}
    ],
    calc:f=>{
      const vol = f.largo*f.ancho*f.alto;
      const cement = Math.ceil(vol*7); const arena = +(vol*0.55).toFixed(2);
      const grava = +(vol*0.75).toFixed(2); const agua = Math.ceil(vol*180);
      return [
        {k:'Volumen',v:`${vol.toFixed(3)} m³`},
        {k:'Sacos cemento (50kg)',v:`${cement} sacos`},
        {k:'Arena',v:`${arena} m³`},
        {k:'Grava',v:`${grava} m³`},
        {k:'Agua aprox.',v:`${agua} L`},
      ];
    }
  },
  {
    id:'escalera', label:'Escalera', icon:'🪜', unit:'pasos', fields:[
      {id:'altura',label:'Altura total (m)',def:2.8},{id:'ancho',label:'Ancho (m)',def:0.9},{id:'huella',label:'Huella (m)',def:0.28}
    ],
    calc:f=>{
      const pasos = Math.round(f.altura/0.18); const contrahuella = +(f.altura/pasos).toFixed(3);
      const largoEsc = +(pasos*f.huella).toFixed(2); const vol = +(pasos*f.ancho*f.huella*0.09).toFixed(3);
      const cement = Math.ceil(vol*7);
      return [
        {k:'Número de pasos',v:`${pasos} pasos`},
        {k:'Contrahuella',v:`${(contrahuella*100).toFixed(1)} cm`},
        {k:'Longitud escalera',v:`${largoEsc} m`},
        {k:'Volumen concreto',v:`${vol} m³`},
        {k:'Sacos cemento',v:`${cement} sacos`},
        {k:'Varilla 3/8"',v:`${Math.ceil(largoEsc*f.ancho*8)} ml`},
      ];
    }
  },
  {
    id:'plomeria', label:'Plomería (instalación)', icon:'🔧', unit:'ml', fields:[
      {id:'banos',label:'Baños',def:2},{id:'cocinas',label:'Cocinas',def:1},{id:'pisos',label:'Niveles',def:1}
    ],
    calc:f=>{
      const salidas = (f.banos*4)+(f.cocinas*3); const tuberiaFria = Math.ceil(salidas*3.5*f.pisos);
      const tuberiaCaliente = Math.ceil(salidas*3*f.pisos); const registros = Math.ceil(salidas*0.4);
      return [
        {k:'Salidas totales',v:`${salidas} salidas`},
        {k:'Tubería agua fría (1/2")',v:`${tuberiaFria} ml`},
        {k:'Tubería agua caliente (1/2")',v:`${tuberiaCaliente} ml`},
        {k:'Tubería drenaje (4")',v:`${Math.ceil(salidas*2.5)} ml`},
        {k:'Registros',v:`${registros} pzas`},
        {k:'Días estimados',v:`${Math.ceil(salidas/3)} días`},
      ];
    }
  },
];

// MEDIDAS
// ══════════════════════════════════════════════════════════════
function Medidas({lang}) {
  const t = T[lang];
  const [sel,setSel] = useState(null);
  const [vals,setVals] = useState({});
  const [res,setRes] = useState(null);

  const select = (m) => {
    setSel(m);
    setVals(Object.fromEntries(m.fields.map(f=>[f.id,f.def])));
    setRes(null);
  };
  const calc = () => {
    if(!sel) return;
    try { setRes(sel.calc(vals)); } catch(e) { console.error(e); }
  };

  if(!sel) return (
    <div style={{paddingBottom:72}}>
      <Hdr title={t.measTitle} sub="Calcula materiales para tu obra"/>
      <div style={{padding:'16px 18px 0',display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
        {MEAS_TYPES.map(m=>(
          <button key={m.id} onClick={()=>select(m)} style={{background:'#fff',border:'1px solid #E8E0D5',borderRadius:14,padding:'14px 10px',cursor:'pointer',textAlign:'center',fontFamily:'inherit'}}>
            <div style={{fontSize:26,marginBottom:6}}>{m.icon}</div>
            <p style={{fontSize:12,fontWeight:700,color:'#1A1A2E',margin:0,lineHeight:1.3}}>{m.label}</p>
            <p style={{fontSize:10,color:'#888',margin:'3px 0 0'}}>{m.unit}</p>
          </button>
        ))}
      </div>
    </div>
  );

  return (
    <div style={{paddingBottom:72}}>
      <div style={{background:'#1A1A2E',padding:'12px 18px 14px',display:'flex',alignItems:'center',gap:12}}>
        <button onClick={()=>{setSel(null);setRes(null);}} style={{background:'none',border:'none',color:'#E8E0D5',cursor:'pointer',fontSize:15,padding:0,fontFamily:'inherit',lineHeight:1}}>←</button>
        <p style={{color:'#E8E0D5',fontSize:13,margin:0}}>{sel.icon} {sel.label}</p>
      </div>
      <div style={{padding:'16px 18px 0'}}>
        {sel.fields.map(f=>(
          <div key={f.id} style={{marginBottom:13}}>
            <label style={{fontSize:12,fontWeight:700,color:'#2D2D2D',display:'block',marginBottom:5}}>{f.label}</label>
            <input type="number" step="any" value={vals[f.id]||''} onChange={e=>setVals({...vals,[f.id]:parseFloat(e.target.value)||0})}
              style={{width:'100%',border:'1px solid #E8E0D5',borderRadius:10,padding:'11px 13px',fontSize:15,outline:'none',fontFamily:'inherit',boxSizing:'border-box'}}
            />
          </div>
        ))}
        <button onClick={calc} style={{width:'100%',background:'#FF6B2B',color:'#fff',border:'none',borderRadius:14,padding:14,fontSize:15,fontWeight:700,cursor:'pointer',fontFamily:'inherit',marginTop:4}}>
          Calcular materiales
        </button>
        {res && (
          <div style={{marginTop:16}}>
            <div style={{background:'#1A1A2E',borderRadius:14,padding:'16px 18px'}}>
              <p style={{color:'#E8E0D5',fontSize:12,fontWeight:700,margin:'0 0 12px'}}>Resultados</p>
              {res.map((r,i)=>(
                <div key={i} style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'8px 0',borderBottom:i<res.length-1?'1px solid rgba(255,255,255,.1)':'none'}}>
                  <span style={{color:'#E8E0D5',fontSize:13}}>{r.k}</span>
                  <span style={{color:'#FF6B2B',fontWeight:700,fontSize:14}}>{r.v}</span>
                </div>
              ))}
            </div>
            <button onClick={()=>setRes(null)} style={{width:'100%',background:'#F5F5F0',border:'1px solid #E8E0D5',borderRadius:14,padding:13,fontSize:14,fontWeight:600,cursor:'pointer',marginTop:10,fontFamily:'inherit'}}>
              Recalcular
            </button>
          </div>
        )}
      </div>
    </div>
  );
}

// SEGURIDAD
// ══════════════════════════════════════════════════════════════
function Seguridad({lang}) {
  const t = T[lang];
  const [phase,setPhase] = useState(SAFETY_PHASES[0]);
  const [checked,setChecked] = useState({});

  const toggle = (phaseId,idx) => {
    const k = `${phaseId}_${idx}`;
    setChecked(c=>({...c,[k]:!c[k]}));
  };
  const doneCount = (ph) => ph.items.filter((_,i)=>checked[`${ph.id}_${i}`]).length;
  const total = phase.items.length;
  const done = doneCount(phase);
  const pct = Math.round(done/total*100);

  return (
    <div style={{paddingBottom:72}}>
      <div style={{background:'#1A1A2E',padding:'16px 18px 16px'}}>

        <div style={{display:'flex',gap:6,overflowX:'auto',paddingBottom:2}}>
          {SAFETY_PHASES.map(ph=>(
            <button key={ph.id} onClick={()=>setPhase(ph)} style={{flexShrink:0,background:phase.id===ph.id?'#FF6B2B':'rgba(255,255,255,.1)',color:'#fff',border:'none',borderRadius:20,padding:'6px 12px',fontSize:11,fontWeight:700,cursor:'pointer',fontFamily:'inherit'}}>
              {ph.label}
            </button>
          ))}
        </div>
      </div>
      <div style={{padding:'14px 18px 0'}}>
        <div style={{background:phase.bg,border:`1px solid ${phase.color}22`,borderRadius:14,padding:'12px 14px',marginBottom:14}}>
          <div style={{display:'flex',justifyContent:'space-between',marginBottom:6}}>
            <span style={{fontSize:13,fontWeight:700,color:phase.color}}>{phase.label}</span>
            <span style={{fontSize:13,fontWeight:700,color:phase.color}}>{done}/{total}</span>
          </div>
          <div style={{background:'rgba(0,0,0,.1)',borderRadius:3,height:5}}>
            <div style={{width:`${pct}%`,height:'100%',background:phase.color,borderRadius:3,transition:'width .3s'}}/>
          </div>
        </div>
        {phase.items.map((item,i)=>{
          const k=`${phase.id}_${i}`;
          const on = !!checked[k];
          return (
            <div key={i} onClick={()=>toggle(phase.id,i)} style={{display:'flex',gap:12,alignItems:'flex-start',background:'#fff',border:'1px solid #E8E0D5',borderRadius:12,padding:'12px 14px',marginBottom:8,cursor:'pointer'}}>
              <div style={{width:22,height:22,borderRadius:6,border:`2px solid ${on?'#22C55E':'#E8E0D5'}`,background:on?'#22C55E':'transparent',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0,transition:'all .2s'}}>
                {on && <Ic d={ICONS.check} size={13} col="#fff"/>}
              </div>
              <p style={{fontSize:13,color:on?'#888':'#1A1A2E',textDecoration:on?'line-through':'none',margin:0,lineHeight:1.4}}>{item}</p>
            </div>
          );
        })}
      </div>
    </div>
  );
}

            </button>
          ))}
        </div>
      </div>
      <div style={{padding:'14px 18px 0'}}>
        {shown.map(o=>(
          <Card key={o.id}>
            <div style={{display:'flex',justifyContent:'space-between',marginBottom:7}}>
              <div><p style={{fontWeight:700,fontSize:14,margin:'0 0 2px',color:'#1A1A2E'}}>{o.cliente}</p><p style={{fontSize:11,color:'#888',margin:0}}>{o.tipo} · {o.direccion}</p></div>
              <div style={{textAlign:'right'}}><p style={{fontWeight:700,fontSize:13,margin:'0 0 3px'}}>{fmt(o.total)}</p><Badge s={o.estado}/></div>
            </div>
            <div style={{display:'flex',justifyContent:'space-between',marginBottom:4}}>
              <span style={{fontSize:11,color:'#888'}}>{t.avance} {o.avance}%</span>
              <span style={{fontSize:11,color:'#888'}}>{o.fotos} fotos · {o.inicio}</span>
            </div>
            <Prog p={o.avance}/>
          </Card>
        ))}
      </div>
    </div>
  );
}

// ══════════════════════════════════════════════════════════════
// QUOTE (kept from v1)
// ══════════════════════════════════════════════════════════════
const PARTIDAS = [
  {concepto:'Obra negra (m²)',precio:4800},{concepto:'Aplanado (m²)',precio:280},
  {concepto:'Azulejo (m²)',precio:320},{concepto:'Plomería',precio:3500},
  {concepto:'Eléctrico',precio:4200},{concepto:'Acarreo',precio:850},
  {concepto:'Tabique (m²)',precio:340},{concepto:'Losa (m²)',precio:1200},
  {concepto:'Pintura (m²)',precio:95},{concepto:'Impermeabilizante',precio:280},
];
function Quote({lang,onDone}) {
  const t = T[lang];
  const [cliente,setCliente] = useState('');
  const [addr,setAddr] = useState('');
  const [items,setItems] = useState([{id:uid(),concepto:'',cantidad:1,precio:0}]);
  const [pct,setPct] = useState(40);
  const [sent,setSent] = useState(false);
  const sub = items.reduce((s,i)=>s+i.cantidad*i.precio,0);
  const antMonto = Math.round(sub*pct/100);
  const addTpl = (p) => { if(!items.find(i=>i.concepto===p.concepto)) setItems([...items.filter(i=>i.concepto!==''),{id:uid(),concepto:p.concepto,cantidad:1,precio:p.precio}]); };
  const upd = (id,f,v) => setItems(items.map(i=>i.id===id?{...i,[f]:v}:i));
  const send = () => { if(!cliente) return; setSent(true); };
  if(sent) return (
    <div style={{display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',height:'80vh',gap:14,padding:32}}>
      <div style={{width:64,height:64,borderRadius:'50%',background:'#22C55E',display:'flex',alignItems:'center',justifyContent:'center'}}>
        <Ic d={ICONS.check} size={32} col="#fff"/>
      </div>
      <h2 style={{color:'#1A1A2E',margin:0}}>¡Cotización enviada!</h2>
      <p style={{color:'#666',textAlign:'center',margin:0,fontSize:14}}>PDF + link SPEI enviados por WhatsApp.</p>
      <button onClick={()=>{setSent(false);setCliente('');setAddr('');setItems([{id:uid(),concepto:'',cantidad:1,precio:0}]);}} style={{background:'#FF6B2B',color:'#fff',border:'none',borderRadius:14,padding:'13px 32px',fontSize:14,fontWeight:700,cursor:'pointer',fontFamily:'inherit',marginTop:8}}>
        Nueva cotización
      </button>
    </div>
  );
  return (
    <div style={{paddingBottom:100}}>
      <Hdr title={t.newQuote} sub={today()}/>
      <div style={{padding:'16px 18px 0'}}>
        <label style={{fontSize:12,fontWeight:700,color:'#2D2D2D',display:'block',marginBottom:5}}>Cliente</label>
        <input value={cliente} onChange={e=>setCliente(e.target.value)} placeholder="Nombre del cliente" style={{width:'100%',border:'1px solid #E8E0D5',borderRadius:10,padding:'11px 13px',fontSize:14,outline:'none',fontFamily:'inherit',boxSizing:'border-box',marginBottom:12}}/>
        <label style={{fontSize:12,fontWeight:700,color:'#2D2D2D',display:'block',marginBottom:5}}>Alcaldía / Dirección</label>
        <input value={addr} onChange={e=>setAddr(e.target.value)} placeholder="Iztapalapa, CDMX" style={{width:'100%',border:'1px solid #E8E0D5',borderRadius:10,padding:'11px 13px',fontSize:14,outline:'none',fontFamily:'inherit',boxSizing:'border-box',marginBottom:14}}/>
        <p style={{fontSize:12,fontWeight:700,color:'#2D2D2D',margin:'0 0 8px'}}>Partidas rápidas CDMX</p>
        <div style={{display:'flex',gap:7,overflowX:'auto',paddingBottom:10,marginBottom:12}}>
          {PARTIDAS.map(p=>(
            <button key={p.concepto} onClick={()=>addTpl(p)} style={{flexShrink:0,background:'#F5F5F0',border:'1px solid #E8E0D5',borderRadius:20,padding:'5px 11px',fontSize:11,cursor:'pointer',fontFamily:'inherit',color:'#1A1A2E'}}>
              {p.concepto}
            </button>
          ))}
        </div>
        <p style={{fontSize:12,fontWeight:700,color:'#2D2D2D',margin:'0 0 8px'}}>Conceptos</p>
        {items.map(item=>(
          <div key={item.id} style={{background:'#fff',border:'1px solid #E8E0D5',borderRadius:12,padding:12,marginBottom:8}}>
            <input value={item.concepto} onChange={e=>upd(item.id,'concepto',e.target.value)} placeholder="Concepto" style={{width:'100%',border:'1px solid #E8E0D5',borderRadius:8,padding:'8px 10px',fontSize:13,outline:'none',fontFamily:'inherit',boxSizing:'border-box',marginBottom:7}}/>
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:7}}>
              {[['cantidad','Cantidad','number'],['precio','Precio','number']].map(([f,l,tp])=>(
                <div key={f}>
                  <label style={{fontSize:10,color:'#888',display:'block',marginBottom:3}}>{l}</label>
                  <input type={tp} value={item[f]} onChange={e=>upd(item.id,f,+e.target.value)} style={{width:'100%',border:'1px solid #E8E0D5',borderRadius:7,padding:'6px 8px',fontSize:13,outline:'none',fontFamily:'inherit',boxSizing:'border-box'}}/>
                </div>
              ))}
              <div>
                <label style={{fontSize:10,color:'#888',display:'block',marginBottom:3}}>Subtotal</label>
                <p style={{margin:0,padding:'6px 0',fontSize:13,fontWeight:700,color:'#FF6B2B'}}>{fmt(item.cantidad*item.precio)}</p>
              </div>
            </div>
          </div>
        ))}
        <button onClick={()=>setItems([...items,{id:uid(),concepto:'',cantidad:1,precio:0}])} style={{width:'100%',background:'#F5F5F0',border:'1px dashed #E8E0D5',borderRadius:12,padding:11,fontSize:13,cursor:'pointer',color:'#666',display:'flex',alignItems:'center',justifyContent:'center',gap:7,fontFamily:'inherit',marginBottom:16}}>
          <Ic d={ICONS.plus} size={15} col="#666"/> Agregar concepto
        </button>
        <div style={{background:'#1A1A2E',borderRadius:14,padding:'16px 18px'}}>
          <div style={{display:'flex',justifyContent:'space-between',marginBottom:10}}>
            <span style={{color:'#E8E0D5',fontSize:13}}>Total obra</span>
            <span style={{color:'#fff',fontSize:17,fontWeight:700}}>{fmt(sub)}</span>
          </div>
          <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:8}}>
            <span style={{color:'#E8E0D5',fontSize:12,whiteSpace:'nowrap'}}>Anticipo</span>
            <input type="range" min={20} max={60} value={pct} onChange={e=>setPct(+e.target.value)} style={{flex:1,accentColor:'#FF6B2B'}}/>
            <span style={{color:'#FF6B2B',fontWeight:700,fontSize:13,minWidth:34}}>{pct}%</span>
          </div>
          <div style={{borderTop:'1px solid rgba(255,255,255,.1)',paddingTop:10,display:'flex',justifyContent:'space-between'}}>
            <span style={{color:'#E8E0D5',fontSize:12}}>Anticipo a cobrar</span>
            <span style={{color:'#FF6B2B',fontSize:19,fontWeight:700}}>{fmt(antMonto)}</span>
          </div>
        </div>
        <button onClick={send} style={{width:'100%',background:'#25D366',color:'#fff',border:'none',borderRadius:14,padding:14,fontSize:14,fontWeight:700,cursor:'pointer',marginTop:14,display:'flex',alignItems:'center',justifyContent:'center',gap:9,fontFamily:'inherit'}}>
          <Ic d={ICONS.wa} size={19} col="#fff"/> Enviar WhatsApp + link de pago
        </button>
      </div>
    </div>
  );
}

// ══════════════════════════════════════════════════════════════

// ══════════════════════════════════════════════════════════════
const TABS = [
  {id:'home',icon:'home'},{id:'quote',icon:'quote'},{id:'obras',icon:'obras'},
  {id:'medidas',icon:'medidas'},{id:'seguridad',icon:'seguridad'},
  {id:'cuadrilla',icon:'cuadrilla'},{id:'reviews',icon:'reviews'},
];
// ── Global top bar — always visible, holds lang toggle ────────
const GlobalBar = ({lang,setLang,tab}) => {
  const t = T[lang];
  const screenTitles = {
    home:'RoofTech', quote: t.newQuote, obras: t.obras,
    medidas: t.measTitle, seguridad: t.safeTitle,
    cuadrilla: t.crewTitle, reviews: t.reviewTitle,
  };
  return (
    <div style={{position:'fixed',top:0,left:'50%',transform:'translateX(-50%)',width:'100%',maxWidth:430,background:'#1A1A2E',zIndex:60,display:'flex',alignItems:'center',justifyContent:'space-between',padding:'10px 18px',boxSizing:'border-box'}}>
      <p style={{color:'#fff',fontSize:15,fontWeight:700,margin:0,letterSpacing:-0.3}}>{screenTitles[tab]||'RoofTech'}</p>
      <div style={{display:'flex',background:'rgba(255,255,255,.12)',borderRadius:20,padding:2,gap:2}}>
        {['es','en'].map(l=>(
          <button key={l} onClick={()=>setLang(l)}
            style={{background:lang===l?'#FF6B2B':'none',color:lang===l?'#fff':'#E8E0D5',border:'none',borderRadius:16,padding:'4px 12px',fontSize:12,fontWeight:700,cursor:'pointer',fontFamily:'inherit',transition:'background .2s'}}>
            {l.toUpperCase()}
          </button>
        ))}
      </div>
    </div>
  );
};

export default function App() {
  const [tab,setTab] = useState('home');
  const [lang,setLang] = useState('es');
  const [obras,setObras] = useState(SEED_OBRAS);
  const t = T[lang];

  return (

      <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>

      {/* Persistent global top bar with lang toggle */}
      <GlobalBar lang={lang} setLang={setLang} tab={tab}/>

      {/* Screen content — padTop 46px to clear the global bar */}
      <div style={{paddingTop:46,paddingBottom:76,minHeight:'100vh'}}>
        {tab==='home'      && <Home obras={obras} lang={lang} setLang={setLang} onTab={setTab}/>}
        {tab==='quote'     && <Quote lang={lang}/>}
        {tab==='obras'     && <Obras obras={obras} lang={lang}/>}
        {tab==='medidas'   && <Medidas lang={lang}/>}
        {tab==='seguridad' && <Seguridad lang={lang}/>}
        {tab==='cuadrilla' && <Cuadrilla lang={lang}/>}
        {tab==='reviews'   && <Reviews lang={lang}/>}
      </div>

      {/* Two-row bottom nav */}
      <div style={{position:'fixed',bottom:0,left:'50%',transform:'translateX(-50%)',width:'100%',maxWidth:430,background:'#fff',borderTop:'1px solid #E8E0D5',zIndex:50}}>
        <div style={{display:'flex'}}>
          {TABS.slice(0,4).map(tb=>(
            <button key={tb.id} onClick={()=>setTab(tb.id)} style={{flex:1,background:'none',border:'none',padding:'7px 0 9px',cursor:'pointer',display:'flex',flexDirection:'column',alignItems:'center',gap:2,fontFamily:'inherit',borderBottom:'1px solid #F0EDE8'}}>
              <Ic d={ICONS[tb.icon]} size={20} col={tab===tb.id?'#FF6B2B':'#aaa'}/>
              <span style={{fontSize:9,color:tab===tb.id?'#FF6B2B':'#aaa',fontWeight:tab===tb.id?700:400}}>{t[tb.id]||tb.id}</span>
            </button>
          ))}
        </div>
        <div style={{display:'flex'}}>
          {TABS.slice(4).map(tb=>(
            <button key={tb.id} onClick={()=>setTab(tb.id)} style={{flex:1,background:'none',border:'none',padding:'7px 0 10px',cursor:'pointer',display:'flex',flexDirection:'column',alignItems:'center',gap:2,fontFamily:'inherit'}}>
              <Ic d={ICONS[tb.icon]} size={20} col={tab===tb.id?'#FF6B2B':'#aaa'}/>
              <span style={{fontSize:9,color:tab===tb.id?'#FF6B2B':'#aaa',fontWeight:tab===tb.id?700:400}}>{t[tb.id]||tb.id}</span>
            </button>
          ))}

      </div>

}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
