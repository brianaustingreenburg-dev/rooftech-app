function sL(l){L=l;document.getElementById('bEs').classList.toggle('on',l==='es');document.getElementById('bEn').classList.toggle('on',l==='en');render();}
function goTab(t){TAB=t;if(t==='solar')solView='home';render();}
function render(){
  const ti=TABS.indexOf(TAB);
  const t=TX[L];
  const titleText=TAB==='solar'?t.screens[8]:(t.screens[ti]||'RoofTech');
  document.getElementById('GT').innerHTML=TAB==='solar'?`<i class="ti ti-sun" style="color:#F59E0B;font-size:16px"></i> ${t.screens[8]}`:titleText;
  document.getElementById('NAV').innerHTML=rNav();
  document.getElementById('BODY').innerHTML=rScreen();
  if(TAB==='blueprints'&&bpView==='canvas') initBpCanvas();
  if(TAB==='solar'&&solView==='measure') initSolCanvas();
  document.getElementById('BODY').scrollTop=0;
}

function rNav(){
  const rows=[TABS.slice(0,5),TABS.slice(5)];
  return rows.map((row,ri)=>`
  <div class="nav-r" style="${ri===1?'border-top:1px solid #F0EDE8':''}">
    ${row.map((t,i)=>{const idx=ri*5+i;const isSolar=t==='solar';return`
    <button class="nb ${TAB===t?'on':''} ${isSolar?'solar':''}" onclick="goTab('${t}')">
      <i class="ti ${TICONS[idx]}" style="${isSolar?'color:#F59E0B':''}" aria-hidden="true"></i>
      <span style="${isSolar?'color:#F59E0B':''}">${TX[L].nav[idx]}</span>
    </button>`;}).join('')}
  </div>`).join('');
}

function rScreen(){
  if(TAB==='home')return rHome();
  if(TAB==='quote')return rQuote();
  if(TAB==='obras')return rObras();
  if(TAB==='medidas')return rMedidas();
  if(TAB==='safety')return rSafety();
  if(TAB==='crew')return rCrew();
  if(TAB==='reviews')return rReviews();
  if(TAB==='blueprints')return rBlueprint();
  if(TAB==='solar')return rSolar();
  return '';
}

function initBpCanvas(){
  const c=document.getElementById('bpC');if(!c)return;
  c.onclick=e=>bpClick(e,c);
  c.onmousemove=e=>{const r=c.getBoundingClientRect();bpHover=bpSnap({x:(e.clientX-r.left)*(BPW/r.width),y:(e.clientY-r.top)*(BPH/r.height)});drawBp();};

  drawBp();
}
function bpSnap(p){const g=bpGrid;return{x:Math.round(p.x/g)*g,y:Math.round(p.y/g)*g};}
function bpClick(e,c){
  const r=c.getBoundingClientRect();
  const p=bpSnap({x:(e.clientX-r.left)*(BPW/r.width),y:(e.clientY-r.top)*(BPH/r.height)});
  if(bpTool==='erase'){for(let i=bpZones.length-1;i>=0;i--){if(ptIn(p,bpZones[i].points)){bpZones.splice(i,1);drawBp();return;}}return;}
  if(bpTool!=='draw')return;
  if(bpPts.length>=3){const fp=bpPts[0];if(dist(p,fp)<18){closeBpZone();return;}}

}
function ptIn(pt,pts){let inside=false;for(let i=0,j=pts.length-1;i<pts.length;j=i++){const xi=pts[i].x,yi=pts[i].y,xj=pts[j].x,yj=pts[j].y;if(((yi>pt.y)!==(yj>pt.y))&&(pt.x<(xj-xi)*(pt.y-yi)/(yj-yi)+xi))inside=!inside;}return inside;}
function dist(a,b){return Math.sqrt((a.x-b.x)**2+(a.y-b.y)**2);}
function pArea(pts){let a=0;for(let i=0,j=pts.length-1;i<pts.length;j=i++){a+=(pts[j].x+pts[i].x)*(pts[j].y-pts[i].y);}return Math.abs(a/2);}
function pPerim(pts){let p=0;for(let i=0;i<pts.length;i++){const n=(i+1)%pts.length;p+=dist(pts[i],pts[n]);}return p;}
function closeBpZone(){if(bpPts.length<3)return;const color=ZC[bpZones.length%ZC.length];const name=TX[L].bpZN[bpZones.length]||`Zona ${bpZones.length+1}`;const mpp=bpScale/bpGrid;bpZones.push({name,color,points:[...bpPts],area:pArea(bpPts)*mpp*mpp,perim:pPerim(bpPts)*mpp});bpPts=[];bpHover=null;render();}
function saveBp(){const tot=bpZones.reduce((s,z)=>s+z.area,0);bpSaved.unshift({addr:bpAddr,obra:bpObra,zones:[...bpZones.map(z=>({...z,points:[...z.points]}))],tot,date:new Date().toLocaleDateString('es-MX')});alert(`${TX[L].bpSave}: ${bpObra||bpAddr}`);}
function drawBp(){
  const c=document.getElementById('bpC');if(!c)return;
  const ctx=c.getContext('2d'),g=bpGrid,sc=bpScale,mpp=sc/g;
  ctx.clearRect(0,0,BPW,BPH);ctx.fillStyle='#0D1117';ctx.fillRect(0,0,BPW,BPH);
  if(bpShowGrid){for(let x=0;x<=BPW;x+=g){ctx.strokeStyle=x%(g*5)===0?'rgba(255,255,255,.1)':'rgba(255,255,255,.04)';ctx.lineWidth=x%(g*5)===0?.7:.3;ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,BPH);ctx.stroke();}for(let y=0;y<=BPH;y+=g){ctx.strokeStyle=y%(g*5)===0?'rgba(255,255,255,.1)':'rgba(255,255,255,.04)';ctx.lineWidth=y%(g*5)===0?.7:.3;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(BPW,y);ctx.stroke();}}
  const cx=BPW/2,cy=BPH/2,u=g;
  ctx.strokeStyle='rgba(100,160,255,.65)';ctx.lineWidth=2.5;ctx.setLineDash([]);ctx.strokeRect(cx-5*u,cy-3.5*u,10*u,7*u);
  ctx.strokeStyle='rgba(100,160,255,.35)';ctx.lineWidth=1.5;[[cx,cy-3.5*u,cx,cy+3.5*u],[cx-5*u,cy-.3*u,cx,cy-.3*u],[cx,cy+.8*u,cx+5*u,cy+.8*u],[cx+3*u,cy-3.5*u,cx+3*u,cy+.8*u]].forEach(([x1,y1,x2,y2])=>{ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();});
  ctx.strokeStyle='rgba(100,160,255,.45)';ctx.lineWidth=1;[[cx-3*u,cy-3.5*u,cx-u,cy-3.5*u],[cx+u,cy-3.5*u,cx+2.5*u,cy-3.5*u],[cx+5*u,cy-2*u,cx+5*u,cy],[cx-5*u,cy+u,cx-5*u,cy+2.5*u]].forEach(([x1,y1,x2,y2])=>{ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();const pp=Math.abs(x2-x1)<.1?[2.5,0]:[0,2.5];ctx.beginPath();ctx.moveTo(x1+pp[0],y1+pp[1]);ctx.lineTo(x2+pp[0],y2+pp[1]);ctx.stroke();});
  if(bpShowDim){ctx.setLineDash([4,3]);ctx.strokeStyle='rgba(255,107,43,.35)';ctx.lineWidth=.8;ctx.beginPath();ctx.moveTo(cx-5*u,cy-4.1*u);ctx.lineTo(cx+5*u,cy-4.1*u);ctx.stroke();ctx.beginPath();ctx.moveTo(cx+5.5*u,cy-3.5*u);ctx.lineTo(cx+5.5*u,cy+3.5*u);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle='rgba(255,107,43,.8)';ctx.font='bold 10px DM Sans';ctx.textAlign='center';ctx.fillText(`${(10*sc).toFixed(1)}m`,cx,cy-4.1*u-5);ctx.save();ctx.translate(cx+5.5*u+12,cy);ctx.rotate(-Math.PI/2);ctx.fillText(`${(7*sc).toFixed(1)}m`,0,0);ctx.restore();}
  ctx.fillStyle='rgba(100,160,255,.65)';ctx.font='bold 11px DM Sans';ctx.textAlign='left';ctx.fillText('N',BPW-18,17);ctx.fillStyle='rgba(255,255,255,.3)';ctx.font='9px DM Sans';ctx.fillText((bpAddr.length>46?bpAddr.slice(0,46)+'…':bpAddr),6,13);
  bpZones.forEach(z=>{if(z.points.length<3)return;ctx.beginPath();z.points.forEach((p,i)=>i===0?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y));ctx.closePath();ctx.fillStyle=z.color+'3A';ctx.fill();ctx.strokeStyle=z.color;ctx.lineWidth=2;ctx.setLineDash([]);ctx.stroke();const zx=z.points.reduce((s,p)=>s+p.x,0)/z.points.length,zy=z.points.reduce((s,p)=>s+p.y,0)/z.points.length;ctx.fillStyle=z.color;ctx.font='bold 11px DM Sans';ctx.textAlign='center';ctx.fillText(z.name,zx,zy-5);ctx.font='10px DM Sans';ctx.fillText(`${z.area.toFixed(1)}m²`,zx,zy+9);ctx.textAlign='left';if(bpShowDim){z.points.forEach((p,i)=>{const n=z.points[(i+1)%z.points.length];const mx=(p.x+n.x)/2,my=(p.y+n.y)/2;const dx=n.x-p.x,dy=n.y-p.y;const len=Math.sqrt(dx*dx+dy*dy)*mpp;if(len<0.05)return;ctx.save();ctx.translate(mx,my);ctx.rotate(Math.atan2(dy,dx));ctx.fillStyle='rgba(255,255,255,.75)';ctx.font='8px DM Sans';ctx.textAlign='center';ctx.fillText(`${len.toFixed(1)}m`,0,-4);ctx.restore();});}});
  if(bpPts.length>0){const color=ZC[bpZones.length%ZC.length];ctx.beginPath();bpPts.forEach((p,i)=>i===0?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y));if(bpHover)ctx.lineTo(bpHover.x,bpHover.y);ctx.strokeStyle=color;ctx.lineWidth=2;ctx.setLineDash([5,4]);ctx.stroke();ctx.setLineDash([]);bpPts.forEach((p,i)=>{ctx.beginPath();ctx.arc(p.x,p.y,i===0?7:4,0,Math.PI*2);ctx.fillStyle=i===0?color:'#fff';ctx.fill();ctx.strokeStyle=color;ctx.lineWidth=2;ctx.stroke();if(i===0&&bpPts.length>=3){ctx.beginPath();ctx.arc(p.x,p.y,13,0,Math.PI*2);ctx.strokeStyle=color+'66';ctx.lineWidth=1.5;ctx.stroke();}});}
}

  <div class="shdr" style="background:linear-gradient(160deg,#1A1A2E,#0D2137)">
    <button onclick="goSol('winner')" style="background:none;border:none;color:#E8E0D5;cursor:pointer;font-size:12px;font-family:inherit;display:flex;align-items:center;gap:4px"><i class="ti ti-arrow-left"></i></button>
    <p style="color:#E8E0D5;font-size:12px;margin-top:8px">${t.solContractSub}</p>
  </div>
  <div style="padding:14px 16px">
    <div style="background:#fff;border:1px solid #E8E0D5;border-radius:14px;padding:18px;margin-bottom:14px">
      <div style="text-align:center;border-bottom:1px solid #E8E0D5;padding-bottom:14px;margin-bottom:14px">
        <p style="font-size:11px;color:#888;margin-bottom:4px">☀️ RoofTech Solar</p>
        <p style="font-size:17px;font-weight:700;color:#1A1A2E;margin-bottom:2px">${L==='es'?'Contrato de instalación solar':'Solar installation contract'}</p>
        <p style="font-size:12px;color:#888">${new Date().toLocaleDateString(L==='es'?'es-MX':'en-US',{year:'numeric',month:'long',day:'numeric'})}</p>
      </div>
      ${[[t.solContractor,w.name],[t.solClient,jobSpec.obra||'Cliente RoofTech'],[t.solAddress,jobSpec.address||'Iztapalapa, CDMX'],[t.solTimeline,`${w.days} ${t.days}`],[t.solWarranty,w.warranty]].map(([k,v])=>`<div class="spec-row"><span style="font-size:12px;color:#888">${k}</span><span style="font-size:13px;font-weight:600;color:#1A1A2E;text-align:right;max-width:55%">${v}</span></div>`).join('')}
      ${selItems.length>0?`<div class="spec-row" style="flex-direction:column;align-items:flex-start;gap:6px"><span style="font-size:12px;color:#888">${t.solProducts}</span><div style="display:flex;flex-wrap:wrap;gap:5px">${selItems.map(i=>`<span style="font-size:11px;color:#1A1A2E;background:#F5F5F0;border-radius:6px;padding:3px 8px">${i.name}</span>`).join('')}</div></div>`:''}
      <div style="border-top:2px solid #1A1A2E;margin-top:12px;padding-top:12px;display:flex;justify-content:space-between;align-items:center">
        <span style="font-size:14px;font-weight:700;color:#1A1A2E">${t.solTotal}</span>
        <span style="font-size:22px;font-weight:700;color:#F59E0B">${fmt(w.price)}</span>
      </div>
    </div>
    <button class="btn-sun" onclick="alert(TX[L].solSignedMsg);goSol('home')"><i class="ti ti-signature"></i>${t.solSignBtn}</button>
    <button class="btn-g" style="margin-top:8px"><i class="ti ti-brand-whatsapp"></i>${L==='es'?'Compartir por WhatsApp':'Share via WhatsApp'}</button>
  </div>`;
}

// ─── HELPERS ─────────────────────────────────────────────────
function submitSolBid(){
  const name=document.getElementById('bi-n')?.value||'Instalador Local';
  const company=document.getElementById('bi-c')?.value||name;
  const price=parseInt(document.getElementById('bi-p')?.value)||70000;
  const days=parseInt(document.getElementById('bi-d')?.value)||10;
  const note=document.getElementById('bi-nt')?.value||'';
  bids.push({name:company,rating:4.5,reviews:5,years:2,price,days,warranty:L==='es'?'20 años paneles':'20yr panels',note,verified:false,badge:''});
  showBidModal=false;
  alert(TX[L].solBidReceived);
  render();
}
function toggleTag(n,p){const idx=qTags.findIndex(i=>i.n===n);if(idx>=0)qTags.splice(idx,1);else qTags.push({n,p});render();}
function addCrew(){const name=document.getElementById('cm-n')?.value,trade=document.getElementById('cm-o')?.value;if(!name||!trade)return;crewList.push({name,trade:{es:trade,en:trade},tel:'—',daily:parseInt(document.getElementById('cm-d')?.value)||0,status:'disponible'});showCrewModal=false;render();}

render();
</script>
