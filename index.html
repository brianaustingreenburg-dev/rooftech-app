<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;font-family:'DM Sans',system-ui,sans-serif}
body{background:#F5F5F0;min-height:100vh}
#app{max-width:430px;margin:0 auto;min-height:100vh;position:relative;background:#F5F5F0}
.gbar{position:fixed;top:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:#1A1A2E;z-index:60;display:flex;align-items:center;justify-content:space-between;padding:10px 18px}
.gbar-title{color:#fff;font-size:15px;font-weight:700;margin:0}
.lang-wrap{display:flex;background:rgba(255,255,255,.12);border-radius:20px;padding:2px;gap:2px}
.lang-btn{background:none;color:#E8E0D5;border:none;border-radius:16px;padding:4px 12px;font-size:12px;font-weight:700;cursor:pointer;transition:background .2s}
.lang-btn.on{background:#FF6B2B;color:#fff}
.content{padding-top:46px;padding-bottom:76px;min-height:100vh}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:#fff;border-top:1px solid #E8E0D5;z-index:50}
.nav-row{display:flex}
.nav-btn{flex:1;background:none;border:none;padding:7px 0 9px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.nav-btn svg{transition:stroke .2s}
.nav-label{font-size:9px;font-weight:400;color:#aaa;transition:color .2s}
.nav-btn.on .nav-label{color:#FF6B2B;font-weight:700}
/* Cards */
.card{background:#fff;border:1px solid #E8E0D5;border-radius:14px;padding:13px 15px;margin-bottom:10px}
.badge{font-size:10px;font-weight:700;padding:2px 7px;border-radius:20px}
.badge-active{background:#FFF3E0;color:#E65100}
.badge-done{background:#E8F5E9;color:#1B5E20}
.prog-wrap{background:#E8E0D5;border-radius:3px;height:5px;overflow:hidden}
.prog-bar{height:100%;border-radius:3px;transition:width .3s}
/* Home */
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:16px 18px}
.stat-box{border-radius:12px;padding:12px 14px}
.stat-box.orange{background:rgba(255,107,43,.15);border:1px solid rgba(255,107,43,.3)}
.stat-box.dark{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1)}
.stat-label{color:#E8E0D5;font-size:11px;margin:0 0 3px}
.stat-val{font-size:20px;font-weight:700;margin:0}
.action-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 18px 18px}
.action-btn{border:none;border-radius:12px;padding:13px 8px;font-size:12px;font-weight:700;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:5px}
.action-btn.orange{background:#FF6B2B;color:#fff}
.action-btn.dark{background:#1A1A2E;color:#fff}
/* Safety */
.phase-tabs{display:flex;gap:6px;overflow-x:auto;padding:0 18px 12px}
.phase-tab{flex-shrink:0;background:rgba(255,255,255,.1);color:#fff;border:none;border-radius:20px;padding:6px 12px;font-size:11px;font-weight:700;cursor:pointer}
.phase-tab.on{background:#FF6B2B}
.check-item{display:flex;gap:12px;align-items:flex-start;background:#fff;border:1px solid #E8E0D5;border-radius:12px;padding:12px 14px;margin-bottom:8px;cursor:pointer;transition:border-color .2s}
.check-box{width:22px;height:22px;border-radius:6px;border:2px solid #E8E0D5;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s}
.check-box.on{background:#22C55E;border-color:#22C55E}
.check-text{font-size:13px;color:#1A1A2E;margin:0;line-height:1.4;transition:all .2s}
.check-text.done{color:#888;text-decoration:line-through}
/* Quote */
.input{width:100%;border:1px solid #E8E0D5;border-radius:10px;padding:11px 13px;font-size:14px;outline:none;margin-bottom:12px}
.tag-row{display:flex;gap:7px;overflow-x:auto;padding-bottom:10px;margin-bottom:12px}
.tag{flex-shrink:0;background:#F5F5F0;border:1px solid #E8E0D5;border-radius:20px;padding:5px 11px;font-size:11px;cursor:pointer;color:#1A1A2E}
.tag:hover{background:#FF6B2B;color:#fff;border-color:#FF6B2B}
.total-box{background:#1A1A2E;border-radius:14px;padding:16px 18px;margin-top:4px}
.wa-btn{width:100%;background:#25D366;color:#fff;border:none;border-radius:14px;padding:14px;font-size:14px;font-weight:700;cursor:pointer;margin-top:14px;display:flex;align-items:center;justify-content:center;gap:9px}
/* Medidas */
.meas-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:16px 18px 0}
.meas-card{background:#fff;border:1px solid #E8E0D5;border-radius:14px;padding:14px 10px;cursor:pointer;text-align:center}
.meas-icon{font-size:26px;margin-bottom:6px}
.result-box{background:#1A1A2E;border-radius:14px;padding:16px 18px;margin-top:16px}
.result-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.1)}
.result-row:last-child{border:none}
/* Crew */
.crew-card{background:#fff;border:1px solid #E8E0D5;border-radius:14px;padding:13px 15px;margin-bottom:10px}
.avatar{width:44px;height:44px;border-radius:50%;background:#1A1A2E;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:17px;flex-shrink:0}
.mini-btn{background:#F5F5F0;border:1px solid #E8E0D5;border-radius:8px;padding:7px 12px;font-size:11px;cursor:pointer;text-decoration:none;color:#1A1A2E;display:flex;align-items:center;gap:4px}
.mini-btn.wa{background:#E8F5E9;border-color:#C8E6C9;color:#1B5E20}
.mini-btn.del{background:#FFF5F5;border-color:#FFCDD2;color:#C62828}
/* Modal */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:100;display:flex;align-items:flex-end}
.modal{background:#fff;width:100%;border-radius:20px 20px 0 0;padding:24px 20px 40px}
.modal-hdr{display:flex;justify-content:space-between;margin-bottom:18px}
.modal-title{margin:0;font-size:17px;font-weight:700;color:#1A1A2E}
.modal-close{background:none;border:none;font-size:20px;cursor:pointer;color:#888}
.save-btn{width:100%;background:#FF6B2B;color:#fff;border:none;border-radius:14px;padding:14px;font-size:15px;font-weight:700;cursor:pointer;margin-top:4px}
/* Reviews */
.review-card{background:#fff;border:1px solid #E8E0D5;border-radius:14px;padding:13px 15px;margin-bottom:10px}
/* Obras */
.filter-row{display:flex;gap:7px;padding:16px 18px 0}
.filter-btn{flex:1;background:rgba(255,255,255,.1);color:#fff;border:none;border-radius:20px;padding:7px 0;font-size:11px;font-weight:700;cursor:pointer}
.filter-btn.on{background:#FF6B2B}
/* Top dark section */
.dark-hdr{background:#1A1A2E;padding:16px 18px}

// ── Helpers ───────────────────────────────────────────────────
function fmt(n){return new Intl.NumberFormat('es-MX',{style:'currency',currency:'MXN',maximumFractionDigits:0}).format(n);}
function svgCheck(){return '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg>';}
function stars(n){return '★'.repeat(n)+'☆'.repeat(5-n);}

function measCalc(id, vals) {
  if(id==='losa'){const v=vals.largo*vals.ancho*vals.espesor;return[{k:'Área',v:(vals.largo*vals.ancho).toFixed(2)+' m²'},{k:'Volumen',v:v.toFixed(3)+' m³'},{k:'Sacos cemento',v:Math.ceil(v*7)+' sacos'},{k:'Arena',v:(v*0.6).toFixed(2)+' m³'},{k:'Grava',v:(v*0.85).toFixed(2)+' m³'}];}
  if(id==='tabique'){const net=vals.alto*vals.largo-(vals.vanos*2.1);return[{k:'Área neta',v:net.toFixed(2)+' m²'},{k:'Tabiques',v:Math.ceil(net*60*1.05)+' pzas'},{k:'Cemento',v:Math.ceil(net*0.3)+' sacos'}];}
  if(id==='pintura'){const a=vals.alto*vals.perimetro;const l=Math.ceil((a/10)*vals.manos);return[{k:'Área',v:a.toFixed(2)+' m²'},{k:'Litros',v:l+' L'},{k:'Cubetas (19L)',v:Math.ceil(l/19)+' cubetas'}];}
  if(id==='azulejo'){const a=vals.largo*vals.ancho;const p=Math.ceil((a/(vals.tamano/100)**2)*1.1);return[{k:'Área',v:a.toFixed(2)+' m²'},{k:'Piezas',v:p+' pzas'},{k:'Adhesivo',v:Math.ceil(a*0.4)+' bolsas'}];}
  if(id==='impermeabilizante'){const a=vals.largo*vals.ancho;const l=Math.ceil(a*0.35*vals.manos);return[{k:'Área',v:a.toFixed(2)+' m²'},{k:'Litros',v:l+' L'},{k:'Cubetas (19L)',v:Math.ceil(l/19)+' cubetas'}];}
  if(id==='aplanado'){const a=vals.alto*vals.perimetro;const v=a*(vals.espesor/100);return[{k:'Área',v:a.toFixed(2)+' m²'},{k:'Cemento',v:Math.ceil(v*8)+' sacos'},{k:'Cal',v:Math.ceil(v*4)+' sacos'}];}
  return [];
}

  renderNav();
  var c = document.getElementById('content');
  if(TAB==='home') c.innerHTML = renderHome(t);
  else if(TAB==='quote') c.innerHTML = renderQuote(t);
  else if(TAB==='obras') c.innerHTML = renderObras(t);
  else if(TAB==='medidas') c.innerHTML = renderMedidas(t);
  else if(TAB==='seguridad') c.innerHTML = renderSafety(t);
  else if(TAB==='cuadrilla') c.innerHTML = renderCrew(t);
  else if(TAB==='reviews') c.innerHTML = renderReviews(t);
  if(CREW_MODAL) c.innerHTML += renderCrewModal(t);
  bindEvents();
}

  h+='<div style="background:#E8F5E9;border:1px solid #A5D6A7;border-radius:14px;padding:14px 16px;margin-bottom:14px">';
  h+='<p style="font-size:12px;font-weight:700;color:#1B5E20;margin:0 0 8px">'+t.copyLink+'</p>';
  h+='<div style="background:#fff;border-radius:10px;padding:10px 12px;margin-bottom:10px"><p style="font-size:11px;color:#1B5E20;margin:0;word-break:break-all">'+link+'</p></div>';
  h+='<button onclick="navigator.clipboard&&navigator.clipboard.writeText(\''+link+'\')" style="width:100%;background:#1B5E20;color:#fff;border:none;border-radius:10px;padding:10px;font-size:13px;font-weight:700;cursor:pointer">'+t.copyLink+'</button></div>';
  h+='<button style="width:100%;background:#25D366;color:#fff;border:none;border-radius:14px;padding:13px;font-size:13px;font-weight:700;cursor:pointer;margin-bottom:14px">💬 '+t.sendWAReview+'</button>';
  h+='<p style="font-size:12px;font-weight:700;color:#2D2D2D;margin:0 0 10px">'+t.recentReviews+'</p>';
  REVIEWS.forEach(function(r){
    h+='<div class="card"><div style="display:flex;justify-content:space-between;margin-bottom:6px"><div style="display:flex;gap:10px;align-items:center"><div class="avatar" style="width:36px;height:36px;font-size:14px">'+r.autor.charAt(0)+'</div><div><p style="font-weight:700;font-size:13px;margin:0 0 2px;color:#1A1A2E">'+r.autor+'</p><span style="color:#FFA000;font-size:13px">'+stars(r.stars)+'</span></div></div><span style="font-size:11px;color:#888">'+r.fecha+'</span></div><p style="font-size:13px;color:#444;margin:0;line-height:1.5">'+r.texto+'</p></div>';
  });
  h+='</div>';
  return h;
}

// ── Event handlers ────────────────────────────────────────────
function bindEvents(){}

function goTab(tab){TAB=tab;render();}
function setLang(l){L=l;render();}
function setFilter(f){OBRAS_FILTER=f;render();}
function setPhase(i){SAFETY_PHASE=i;render();}
function toggleCheck(i){var k=SAFETY_PHASE+'_'+i;SAFETY_CHECKED[k]=!SAFETY_CHECKED[k];render();}
function selectMeas(id){
  MEAS_SEL=id;MEAS_RES=null;
  var t=TX[L].measTypes.find(function(m){return m.id===id;});
  MEAS_VALS={};
  t.fields.forEach(function(f){MEAS_VALS[f.id]=f.def;});
  render();
}
function clearMeas(){MEAS_SEL=null;MEAS_RES=null;render();}
function updateMeas(id,val){MEAS_VALS[id]=parseFloat(val)||0;}
function doCalc(){MEAS_RES=measCalc(MEAS_SEL,MEAS_VALS);render();}
function clearRes(){MEAS_RES=null;render();}
function addItem(){QUOTE_ITEMS.push({id:++UID,concepto:'',cantidad:1,precio:0});render();}
function addPartida(c,p){
  if(!QUOTE_ITEMS.find(function(i){return i.concepto===c;})){
    var blank=QUOTE_ITEMS.find(function(i){return !i.concepto;});
    if(blank){blank.concepto=c;blank.precio=p;}
    else QUOTE_ITEMS.push({id:++UID,concepto:c,cantidad:1,precio:p});
    render();
  }
}
function updItem(id,field,val){var item=QUOTE_ITEMS.find(function(i){return i.id===id;});if(item){item[field]=val;}render();}
function sendQuote(){if(!QUOTE_CLIENT)return;QUOTE_SENT=true;render();}
function resetQuote(){QUOTE_SENT=false;QUOTE_CLIENT='';QUOTE_ADDR='';QUOTE_ITEMS=[{id:++UID,concepto:'',cantidad:1,precio:0}];QUOTE_PCT=40;render();}
function rerenderQuoteTotals(slider){
  QUOTE_PCT=+slider.value;
  var sub=QUOTE_ITEMS.reduce(function(s,i){return s+i.cantidad*i.precio;},0);
  var lbl=document.getElementById('pct-lbl');if(lbl)lbl.textContent=QUOTE_PCT+'%';
  var ant=document.getElementById('ant-lbl');if(ant)ant.textContent=fmt(Math.round(sub*QUOTE_PCT/100));
}
function openCrewModal(){CREW_MODAL=true;CREW_FORM={nombre:'',oficio:'',tel:'',diario:''};render();}
function closeModal(e){if(e.target===e.currentTarget){CREW_MODAL=false;render();}}
function saveCrew(){
  if(!CREW_FORM.nombre||!CREW_FORM.oficio)return;
  CREW.push({id:'c'+(++UID),nombre:CREW_FORM.nombre,oficio:CREW_FORM.oficio,tel:CREW_FORM.tel,diario:+CREW_FORM.diario||0,status:'disponible'});
  CREW_MODAL=false;render();
}
function removeCrew(id){CREW=CREW.filter(function(c){return c.id!==id;});render();}

// ── Init ─────────────────────────────────────────────────────
render();
</script>
</body>
</html>
